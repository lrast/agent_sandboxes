#cloud-config
# The SSH key placeholders below are filled in by install_os.sh from files in keys/.
autoinstall:
  version: 1
  # No "identity" section: both accounts are defined below via user-data.
  ssh:
    install-server: true
    allow-pw: false
  # Installed by the installer into the new system (needs network only during install).
  packages:
    - python3
    - python3-pip
    - python3-venv
    - nftables
  # Runs at install time in the installer environment; /target is the new system.
  # uv is downloaded by the installer's curl straight into the target's /usr/local/bin.
  late-commands:
    - curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/target/usr/local/bin UV_NO_MODIFY_PATH=1 sh
    # Claude Code installer (URL injected by install_os.sh).
    # Downloaded in the installer, then run inside the target chroot as root with
    # HOME=/opt/agent so it lands in a system-wide location (the bot user doesn't
    # exist yet; cloud-init creates it on first boot).
    - mkdir -p /target/opt/agent
    - curl -fsSL '__AGENT_INSTALL_URL__' -o /target/tmp/agent-install.sh
    - curtin in-target --target=/target -- env HOME=/opt/agent bash -c 'umask 022 && bash /tmp/agent-install.sh'
    - rm -f /target/tmp/agent-install.sh
    - chmod -R a+rX /target/opt/agent
    - |
      cat > /target/etc/profile.d/agent.sh <<'PROFILE'
      export PATH="/opt/agent/.local/bin:/opt/agent/bin:$PATH"
      PROFILE
  # This block gets passed to the final OS and runs on its VERY FIRST boot
  user-data:
    hostname: ubuntu-vm
    ssh_pwauth: false
    # Pinned host key (keys/vmhostkey), so host-side ssh can use
    # StrictHostKeyChecking. Only ed25519; no other host keys are generated.
    # (genkeytypes only fills in missing types, and ed25519 is supplied here; the
    # autoinstall schema rejects an empty list.)
    ssh_deletekeys: true
    ssh_genkeytypes: [ed25519]
    ssh_keys:
      ed25519_public: __VM_HOST_PUBKEY__
      ed25519_private: |
__VM_HOST_PRIVKEY__
    users:
      # Admin account: key-only login, passwordless sudo
      - name: vm_admin
        shell: /bin/bash
        lock_passwd: true
        sudo: ALL=(ALL) NOPASSWD:ALL
        ssh_authorized_keys:
          - __ADMIN_SSH_KEY__
      # Unprivileged agent account: key-only login, no sudo
      - name: bot
        shell: /bin/bash
        lock_passwd: true
        sudo: false
        ssh_authorized_keys:
          - __BOT_SSH_KEY__
    write_files:
      - path: /etc/ssh/sshd_config.d/10-agent.conf
        owner: root:root
        permissions: '0644'
        content: |
          HostKey /etc/ssh/ssh_host_ed25519_key
          AllowUsers vm_admin bot
          PasswordAuthentication no
          KbdInteractiveAuthentication no

          # Agent account: shell only, no forwarding of any kind
          Match User bot
            DisableForwarding yes
            PermitTunnel no
            PermitUserRC no
    runcmd:
      - systemctl enable --now nftables.service
      - systemctl try-reload-or-restart ssh.service
