#cloud-config
# The SSH key and Claude token placeholders below are filled in by install_os.sh from files in keys/.
autoinstall:
  version: 1
  # No "identity" section: both accounts are defined below via user-data.
  ssh:
    install-server: true
    allow-pw: false
  # Installed by the installer into the new system (needs network only during install).
  packages:
    - python3
    - python3-pip
    - python3-venv
    - nftables
    # mount-in-vm: guest end of the reverse sshfs shares (pulls in fuse3)
    - sshfs
    # Zed's "Claude (VM)" agent: claude-agent-acp needs Node >= 22
    - nodejs
    - npm
  # Runs at install time in the installer environment; /target is the new system.
  # The script body is vm-scripts/late-commands.sh, inlined by install_os.sh
  # (__LATE_COMMANDS_SH__).
  late-commands:
    - |
      cat > /target/tmp/late-commands.sh <<'__END_SCRIPT__'
      __LATE_COMMANDS_SH__
      __END_SCRIPT__
    - bash /target/tmp/late-commands.sh
    - rm -f /target/tmp/late-commands.sh

  # This block gets passed to the final OS and runs on its VERY FIRST boot
  user-data:
    hostname: ubuntu-vm
    ssh_pwauth: false
    # Pinned host key (keys/vmhostkey), so host-side ssh can use
    # StrictHostKeyChecking. Only ed25519; no other host keys are generated.
    # (genkeytypes only fills in missing types, and ed25519 is supplied here; the
    # autoinstall schema rejects an empty list.)
    ssh_deletekeys: true
    ssh_genkeytypes: [ed25519]
    ssh_keys:
      ed25519_public: __VM_HOST_PUBKEY__
      ed25519_private: |
        __VM_HOST_PRIVKEY__
    users:
      # Admin account: key-only login, passwordless sudo
      - name: vm_admin
        shell: /bin/bash
        lock_passwd: true
        sudo: ALL=(ALL) NOPASSWD:ALL
        ssh_authorized_keys:
          - __ADMIN_SSH_KEY__
      # Unprivileged agent account: key-only login, no sudo
      - name: bot
        shell: /bin/bash
        lock_passwd: true
        sudo: false
        ssh_authorized_keys:
          - __BOT_SSH_KEY__
    write_files:
      - path: /etc/ssh/sshd_config.d/10-agent.conf
        owner: root:root
        # 0600: holds the bot's Claude OAuth token (sshd reads it as root)
        permissions: '0600'
        content: |
          HostKey /etc/ssh/ssh_host_ed25519_key
          AllowUsers vm_admin bot
          PasswordAuthentication no
          KbdInteractiveAuthentication no

          # Agent account: shell only, no forwarding of any kind
          Match User bot
            DisableForwarding yes
            PermitTunnel no
            PermitUserRC no
            # Claude Code login for every bot ssh session (interactive or command)
            SetEnv CLAUDE_CODE_OAUTH_TOKEN=__CLAUDE_OAUTH_TOKEN__
      # Skip Claude Code's first-run onboarding (the snapshot would reset it every boot).
      # defer: written after the bot user exists.
      - path: /home/bot/.claude.json
        owner: bot:bot
        permissions: '0600'
        defer: true
        content: |
          {"hasCompletedOnboarding": true}
      # mount-in-vm mounts shares with allow_other so bot can use them. sshfs runs as
      # root there, which doesn't need this; it only matters for non-root FUSE mounts.
      - path: /etc/fuse.conf
        owner: root:root
        permissions: '0644'
        content: |
          user_allow_other
      # First-boot setup (vm-scripts/first-boot.sh, inlined by install_os.sh)
      - path: /var/lib/cloud/first-boot.sh
        owner: root:root
        permissions: '0700'
        content: |
          __FIRST_BOOT_SH__
    runcmd:
      - [bash, /var/lib/cloud/first-boot.sh]
