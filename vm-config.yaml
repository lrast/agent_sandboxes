#cloud-config
# The SSH key placeholders below are filled in by install_os.sh from files in keys/.
autoinstall:
  version: 1
  # No "identity" section: both accounts are defined below via user-data.
  ssh:
    install-server: true
    allow-pw: false
  # Installed by the installer into the new system (needs network only during install).
  packages:
    - python3
    - python3-pip
    - python3-venv
  # Runs at install time in the installer environment; /target is the new system.
  # uv is downloaded by the installer's curl straight into the target's /usr/local/bin.
  late-commands:
    - curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/target/usr/local/bin UV_NO_MODIFY_PATH=1 sh
    # Lines starting with "#@agent#" are only kept when install_os.sh is run with
    # --claude / --hermes (marker stripped); otherwise they are deleted.
    # Agent installer (URL injected by install_os.sh).
    # Downloaded in the installer, then run inside the target chroot as root with
    # HOME=/opt/agent so it lands in a system-wide location (the bot user doesn't
    # exist yet; cloud-init creates it on first boot).
#@agent#    - mkdir -p /target/opt/agent
#@agent#    - curl -fsSL '__AGENT_INSTALL_URL__' -o /target/tmp/agent-install.sh
#@agent#    - curtin in-target --target=/target -- env HOME=/opt/agent bash -c 'umask 022 && bash /tmp/agent-install.sh'
#@agent#    - rm -f /target/tmp/agent-install.sh
#@agent#    - chmod -R a+rX /target/opt/agent
#@agent#    - |
#@agent#      cat > /target/etc/profile.d/agent.sh <<'PROFILE'
#@agent#      export PATH="/opt/agent/.local/bin:/opt/agent/bin:$PATH"
#@agent#      PROFILE
  # This block gets passed to the final OS and runs on its VERY FIRST boot
  user-data:
    hostname: ubuntu-vm
    ssh_pwauth: false
    # Pinned host key (keys/vmhostkey), so host-side ssh can use
    # StrictHostKeyChecking. Only ed25519; no other host keys are generated.
    # (genkeytypes only fills in missing types, and ed25519 is supplied here; the
    # autoinstall schema rejects an empty list.)
    ssh_deletekeys: true
    ssh_genkeytypes: [ed25519]
    ssh_keys:
      ed25519_public: __VM_HOST_PUBKEY__
      ed25519_private: |
__VM_HOST_PRIVKEY__
    users:
      # Admin account: key-only login, passwordless sudo
      - name: vm_admin
        shell: /bin/bash
        lock_passwd: true
        sudo: ALL=(ALL) NOPASSWD:ALL
        ssh_authorized_keys:
          - __ADMIN_SSH_KEY__
      # Unprivileged agent account: key-only login, no sudo
      - name: bot
        shell: /bin/bash
        lock_passwd: true
        sudo: false
        ssh_authorized_keys:
          - __BOT_SSH_KEY__
    write_files:
      - path: /etc/ssh/sshd_config.d/10-agent.conf
        owner: root:root
        permissions: '0644'
        content: |
          HostKey /etc/ssh/ssh_host_ed25519_key
          AllowUsers vm_admin bot
          PasswordAuthentication no
          KbdInteractiveAuthentication no

          # Agent account: shell only, no forwarding of any kind
          Match User bot
            DisableForwarding yes
            PermitTunnel no
            PermitUserRC no
    runcmd:
      # sshd policy (first: the disk script below uses set -e/exit).
      - systemctl try-reload-or-restart ssh.service
      # Format /dev/vdb only if blank; abort if it holds a non-ext4 filesystem.
      # Single script so set -e stops the mount steps too.
      - |
        set -e
        fstype=$(blkid -o value -s TYPE /dev/vdb 2>/dev/null || true)
        if [ -z "$fstype" ]; then
          mkfs.ext4 /dev/vdb
        elif [ "$fstype" != "ext4" ]; then
          echo "ERROR: /dev/vdb has unexpected filesystem '$fstype'; refusing to continue" >&2
          exit 1
        fi
        mkdir -p /home/bot/state
        # remove noexec if the agent needs to run things off the state disk
        echo '/dev/vdb /home/bot/state ext4 defaults,nosuid,nodev,noexec 0 2' >> /etc/fstab
        mount -a
        chown -R bot:bot /home/bot/state
